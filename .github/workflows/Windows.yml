name: Windows
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
    paths:
    - 'Sources/**'
    - 'Tests/**'
    - 'Macros/**'
    - 'Dependencies/**'
    - 'Package.swift'
    - 'Package.resolved'
    - '.github/workflows/Windows.yml'
  pull_request:
    branches:
    - '**'
    paths:
    - 'Sources/**'
    - 'Tests/**'
    - 'Macros/**'
    - 'Dependencies/**'
    - 'Package.swift'
    - 'Package.resolved'
    - '.github/workflows/Windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build_Test-Windows-Windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          # GateEngine's swift-tools-version is 6.1; installing 5.10 caused SwiftPM to refuse to
          # resolve the manifest ("using Swift tools version 6.1.0 but the installed version is
          # 5.10.0"). Use the non-deprecated swift-version/swift-build inputs at 6.1.
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - uses: actions/checkout@v5

      - name: Swift Version
        run: swift --version

      - name: Build
        run: swift build
      - name: Test
        run: swift test

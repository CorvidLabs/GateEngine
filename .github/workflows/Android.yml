name: Android
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '**'

jobs:
  Build_Test-Linux-Android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Swift 6
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.0.3"

    - name: Install Android SDK
      run: |
        swift sdk install https://github.com/finagolfin/swift-android-sdk/releases/download/6.0.3/swift-6.0.3-RELEASE-android-24-0.1.artifactbundle.tar.gz

    - name: Swift Version
      run: swift --version

    - name: Build using Swift
      run: swift build --swift-sdk aarch64-unknown-linux-android24

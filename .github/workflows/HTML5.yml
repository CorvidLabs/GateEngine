name: HTML5
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '**'

jobs:
  Build_Test-macOS-WASI:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.2.2"

    - name: Install Swift WASM SDK
      run: |
        # Use official swift.org SDK which includes both standard and embedded variants
        swift sdk install https://download.swift.org/swift-6.2.2-release/wasm-sdk/swift-6.2.2-RELEASE/swift-6.2.2-RELEASE_wasm.artifactbundle.tar.gz --checksum 128fa003e0cad624897c2b1d5f07cedf400e3c8bd851d304e57440b591cbe606

    - name: List SDKs
      run: swift sdk list

    - name: Swift Version
      run: swift --version

    - name: Build for WASI
      # Use standard SDK (swift-6.2.2-RELEASE_wasm) not embedded (_wasm-embedded)
      # Standard SDK includes Foundation/Codable support which GateUtilities requires
      run: swift build --swift-sdk swift-6.2.2-RELEASE_wasm --traits HTML5
    

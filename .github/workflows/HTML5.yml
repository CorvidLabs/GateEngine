name: HTML5
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '**'

jobs:
  Build_Test-macOS-WASI:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install SwiftWasm
      run: |
        brew install swiftwasm/tap/swift-wasm

    - name: Swift Version
      run: swift --version

    - name: Build for WASI
      run: swift build --triple wasm32-unknown-wasi
    

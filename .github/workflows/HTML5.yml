name: HTML5
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - '**'

jobs:
  Build_Test-macOS-WASI:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Install Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: "6.0.3"

    - name: Install SwiftWasm SDK
      run: |
        swift sdk install https://github.com/aspect-build/aspect-swiftwasm-releases/releases/download/6.0.2/swift-wasm-6.0.2-macos_arm64-wasm32-unknown-wasi.artifactbundle.zip

    - name: Swift Version
      run: swift --version

    - name: Build for WASI
      run: swift build --swift-sdk wasm32-unknown-wasi
    
